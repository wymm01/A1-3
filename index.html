<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 믹솔로지스트 - 맞춤 음료 추천</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">AI Mixologist</div>
    <nav class="nav">
      <a href="#about">서비스 소개</a>
      <a href="#recommend">AI 추천 받기</a>
      <a href="#faq">FAQ</a>
    </nav>
  </header>

  <main class="container">
    <!-- 1. 서비스 소개 섹션 -->
    <section id="about" class="hero">
      <h1>오늘 기분에 맞는 특별한 음료를 찾아보세요</h1>
      <p>AI 믹솔로지스트가 당신의 기분과 취향을 분석하여 최적의 음료 레시피를 추천해 드립니다.</p>
    </section>

    <!-- 2. AI 추천 섹션 -->
    <section id="recommend" class="card">
      <h2>AI 맞춤 음료 추천</h2>
      <form id="recommendForm">
        <div class="form-group">
          <label for="mood">현재 기분 (필수)</label>
          <input type="text" id="mood" placeholder="예: 우울함, 신남, 피곤함" required>
        </div>
        <div class="form-group">
          <label for="preference">선호 재료/취향 (선택)</label>
          <input type="text" id="preference" placeholder="예: 상큼함, 탄산, 논알콜, 과일">
        </div>
        <button type="submit" id="submitBtn">추천받기</button>
      </form>
      <div id="result" class="result hidden"></div>
    </section>

    <!-- 3. FAQ 섹션 -->
    <section id="faq" class="card">
      <h2>자주 묻는 질문</h2>
      <details>
        <summary>논알콜 음료도 추천해주나요?</summary>
        <p>네! 선호 취향에 '논알콜'을 적어주시면 알콜이 들어가지 않은 음료를 추천합니다.</p>
      </details>
      <details>
        <summary>추천 결과는 어떻게 활용하나요?</summary>
        <p>제공되는 레시피를 보고 집에서 홈카페/홈바를 즐겨보세요.</p>
      </details>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 AI Mixologist. All rights reserved.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
